[package]
name = "localify-audio"
description = "Motor de audio: decodificacion, mezcla, crossfade, ecualizador y salida."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
localify-core = { workspace = true }

# Demux y decodificación. `symphonia` cubre todos los formatos que sirve
# YouTube menos uno: Opus. Ver `decode/opus.rs`.
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
symphonia-core = "0.6"
symphonia-adapter-libopus = "0.3"

# Salida al dispositivo del sistema (WASAPI en modo compartido).
cpal = "0.18"

# Cola SPSC sin locks entre el hilo de decodificación y el callback de audio.
rtrb = "0.3"

tracing = { workspace = true }
rubato = "4"
audioadapter-buffers = "4"

[lints]
workspace = true
