[package]
name = "localify-integrations"
description = "Integraciones opcionales: Discord Rich Presence y letras."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
localify-core = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

# Los tests contra LRCLIB real necesitan un runtime completo. Van marcados
# `#[ignore]`: comprueban la forma de la respuesta del servicio, que ningún
# doble puede verificar.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
